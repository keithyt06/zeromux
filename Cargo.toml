[package]
name = "zeromux"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "compression-gzip", "compression-br"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["axum"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
mime_guess = "2"
zstd = "0.13"
http = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }
jsonwebtoken = "9"
cron = "0.12"
chrono = "0.4"
chrono-tz = "0.9"
tempfile = "3.27.0"
web-push-native = "0.4"
url = "2"
# WS client for the Kiro Crew Gateway event stream. Already in Cargo.lock as
# axum's transitive dep. `connect` = ["stream","tokio/net","handshake"]; NO TLS
# feature on purpose — the gateway is loopback `ws://` only, and `wss://` would
# be a misconfiguration we want to fail loudly (tls.rs:157-165 raises
# TlsFeatureNotEnabled).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
p256 = { version = "0.13", features = ["pem", "ecdsa"] }
# Fuzzy path matching for /api/search (fzf-style, Helix's matcher). Pure Rust.
nucleo-matcher = "0.3"
# Vault watcher (fuzzy-search 1b): inotify on the local JuiceFS FUSE mount. No
# `stream` feature — we poll the raw fd from a dedicated OS thread, no tokio glue.
inotify = { version = "0.11", default-features = false }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
